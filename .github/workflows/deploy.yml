name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Build + gen-headers: garante que a CSP fica abaixo do limite de
      # 2000 chars/linha da Cloudflare (o gen-headers falha se estourar).
      - run: bun run build
        env:
          # Beta sign-up form endpoint (e.g. Formspree). Set it under
          # Settings → Secrets and variables → Actions → Variables.
          # Empty → the form falls back to a mailto: to the contact email.
          PUBLIC_BETA_FORM_ENDPOINT: ${{ vars.PUBLIC_BETA_FORM_ENDPOINT }}
          # Cloudflare Web Analytics token — Cloudflare dashboard →
          # Web Analytics → add site. Cookieless; empty → no beacon.
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}

# Deploy é manual: `bun run build && bunx wrangler deploy` a partir de uma
# máquina com a credencial Cloudflare (ver README). Não há wrangler-action
# porque o token de conta ainda não está nos secrets do repo.
