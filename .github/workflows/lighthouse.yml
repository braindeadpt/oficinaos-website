name: Lighthouse CI

# Corre em cada PR para main: build, serve o dist/ e mede as páginas de lighthouserc.json
# (home, docs, download, produtos — 3 execuções cada, perfil mobile por omissão do Lighthouse). Falha se a mediana de
# qualquer categoria ficar abaixo de 95. Não faz deploy.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          # Só para ler as estrelas do repositório no build (evita o rate-limit anónimo).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Headers smoke test — CSP servida como em produção
        run: |
          bunx wrangler dev --port 8787 --log-level warn &
          WPID=$!
          trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsI http://localhost:8787/ >/dev/null 2>&1 && break; sleep 1; done
          # Cada página tem de receber UMA CSP — sem o `!` a regra /* fundia-se
          # com a específica e o browser aplicava as duas (menu/forms mortos).
          [ "$(curl -sI http://localhost:8787/ | grep -ci '^content-security-policy:')" = "1" ]
          # O form-action esperado vem do build — cobre um endpoint configurado
          # via PUBLIC_BETA_FORM_ENDPOINT, não só o destino predefinido.
          ACTION=$(grep -o 'action="[^"]*"' dist/pro/index.html | head -1 | cut -d'"' -f2)
          CSP_PRO=$(curl -sI http://localhost:8787/pro/ | grep -i '^content-security-policy:')
          echo "form action: $ACTION"
          # //host/x resolve com o esquema da página (https) — como o gen-headers.
          case "$ACTION" in //* ) ACTION="https:$ACTION" ;; esac
          case "$ACTION" in
            http* )    ORIGIN=$(echo "$ACTION" | sed -E 's#^(https?)://([^/]+).*#\1://\2#')
                       echo "$CSP_PRO" | grep -qF "form-action 'self' $ORIGIN" ;;
            mailto:* ) echo "$CSP_PRO" | grep -qF "form-action 'self' mailto:" ;;
            * )        echo "$CSP_PRO" | grep -q "form-action 'self'" ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/pagina-que-nao-existe)
          [ "$code" = "404" ]
          curl -sI http://localhost:8787/pagina-que-nao-existe | grep -qi '^content-security-policy:'
      - name: Lighthouse — recolher (3 execuções por página)
        run: bunx @lhci/cli@0.15.1 collect
      - name: Métricas por execução (FCP / LCP / TBT / CLS)
        if: always()
        run: |
          bun tools/lhci-summary.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lighthouse — verificar limites (mediana ≥ 95)
        run: bunx @lhci/cli@0.15.1 assert
      - name: Guardar relatórios HTML
        if: always()
        run: bunx @lhci/cli@0.15.1 upload
      # Só em falha: os relatórios guardados em todas as execuções encheram
      # a quota de artifacts da conta (partilhada por todos os repos). Num
      # run verde o resumo do passo e o `lhci upload` acima chegam.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # .lighthouseci é pasta hidden — sem isto o upload encontrava zero
          # ficheiros ("No files were found with the provided path").
          include-hidden-files: true
          retention-days: 5
