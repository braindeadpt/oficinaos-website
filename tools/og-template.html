<!doctype html>
<!-- Modelo das imagens de partilha (public/og/*.jpg, 1200×630). Para gerar: copiar para public/_og.html,
     abrir no dev server com ?label=&ta=&tb=&img=&pos=&cols=, capturar 1200×630 e apagar o _og.html. -->
<html lang="pt">
<head>
<meta charset="utf-8">
<title>og</title>
<style>
  @font-face { font-family: "Manrope Variable"; src: url("/fonts/manrope-latin.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Inter Variable"; src: url("/fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f4f8ff; font-family: "Inter Variable", system-ui, sans-serif; color: #0f172a; }
  .card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 500px 1fr; }
  .text { padding: 64px 40px 56px 64px; display: flex; flex-direction: column; }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 650; }
  .eyebrow i { width: 12px; height: 12px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 6px #d1fae5; }
  h1 { margin: 28px 0 0; font-family: "Manrope Variable", sans-serif; font-weight: 800; font-size: 50px; line-height: 1.04; letter-spacing: -0.045em; }
  h1 span { display: block; }
  h1 .b { color: #475569; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 650; }
  .logo { width: 34px; height: 34px; display: block; }
  .foot small { margin-left: auto; color: #475569; font-weight: 500; font-size: 20px; }
  .photo { position: relative; margin: 28px 28px 28px 0; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 60px -30px rgb(15 23 42 / 0.35); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <p class="eyebrow"><i></i><span id="label"></span></p>
    <h1><span id="ta"></span><span class="b" id="tb"></span></h1>
    <p class="foot"><svg class="logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="0" y="0" width="40" height="40" rx="11.5" fill="#2563eb"/><path d="M40 20 V28.5 A11.5 11.5 0 0 1 28.5 40 H18 C25 36.5 35.5 29 40 20 Z" fill="#10b981" opacity="0.48"/><path d="M11.5 1.25 H28.5 A10.25 10.25 0 0 1 38.75 11.5 V14 C31 10.5 22 9.5 1.25 14 V11.5 A10.25 10.25 0 0 1 11.5 1.25 Z" fill="#ffffff" opacity="0.18"/><rect x="0.75" y="0.75" width="38.5" height="38.5" rx="10.75" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2"/><circle cx="20" cy="20" r="11.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-opacity="0.96"/><path d="M20 12.6 L21.9 17.1 L26.8 17.5 L23.0 20.8 L24.2 25.6 L20 23.0 L15.8 25.6 L17.0 20.8 L13.2 17.5 L18.1 17.1 Z" fill="#ffffff"/><circle cx="20" cy="20" r="2.2" fill="#2563eb"/></svg>OficinaOS<small>oficinaos.app</small></p>
  </div>
  <div class="photo"><img id="img" alt=""></div>
</div>
<script>
  // Página temporária só para gerar as imagens de partilha (apagada depois de gerar).
  var q = new URLSearchParams(location.search);
  document.getElementById("label").textContent = q.get("label");
  document.getElementById("ta").textContent = q.get("ta");
  document.getElementById("tb").textContent = q.get("tb");
  document.getElementById("img").src = q.get("img");
  if (q.get("pos")) document.getElementById("img").style.objectPosition = q.get("pos");
  if ((q.get("ta") + q.get("tb")).length > 60) document.querySelector("h1").style.fontSize = "40px";
  if (q.get("cols")) document.querySelector(".card").style.gridTemplateColumns = q.get("cols") + "px 1fr";
</script>
</body>
</html>
